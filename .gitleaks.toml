# Канон bootstrap-project (templates/gitleaks.toml). Копируется в корень
# репозитория как .gitleaks.toml байт в байт, копию не правят. Gitleaks сам читает
# этот файл из корня клона везде, где сканирует репозиторий: недельный скан всей
# истории, проверка PR и предпроверка воркера конвейера перед PR.
#
# Правила по умолчанию остаются все. Снято одно ложное срабатывание: контрольные
# суммы UI kit. Манифест кита (dist/MANIFEST.json в самом ките, vendor/uikit/
# MANIFEST.json у приложения) в старых версиях ставил SHA-256 на одну строку с
# именем файла: "css/tokens.css": "<64 hex>". Правило generic-api-key видит в имени
# слово token или key и принимает сумму за ключ. Новые версии кита ставят сумму на
# свою строку, и правило её не видит, но старые строки остаются в истории навсегда,
# а недельный скан проходит всю историю каждого репозитория с китом.
#
# Исключение узкое: только правило generic-api-key, только файл манифеста кита и
# только значение из 64 строчных hex-символов. Ключ другого вида в манифесте и
# такая же сумма в любом другом файле находятся, как раньше. Ложное срабатывание
# одного репозитория сюда не вносят: его отпечаток идёт в .gitleaksignore.

[extend]
useDefault = true

[[allowlists]]
description = "UI kit manifest: SHA-256 of a kit file, not a key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^dist/MANIFEST\.json$''',
  '''(?:^|/)vendor/uikit/MANIFEST\.json$''',
]
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']
