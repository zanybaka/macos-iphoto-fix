name: CI

# Триггеры - канон CI (реестр профилей репозиториев в vps_2026): push в main +
# pull_request + workflow_dispatch. Раньше стоял голый `push:` без фильтра веток:
# каждый PR из ветки этого же репозитория гонялся ДВАЖДЫ (на push ветки и на сам
# PR). Минуты публичного репо бесплатны, но два одинаковых прогона на PR - шум в
# check-runs, по которым судит verify-гейт волны (AI-012).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Отмена только для PR (vps_2026 CI-009). В PR пуши до последнего устарели по определению.
# В push в main отмена оставила бы коммит в истории непроверенным навсегда, и выглядело бы это
# как обычная отмена. Не заменять литералом true - форма канонична для всех репозиториев.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck (fixer script)
        # gate at warning so advisory info/style findings can't break the build
        # across shellcheck versions; the script is also clean at default severity.
        run: shellcheck --severity=warning fix-iphoto-sequoia.sh

      - name: Bash syntax check
        run: bash -n fix-iphoto-sequoia.sh
