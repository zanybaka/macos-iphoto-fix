name: security

# Секреты и SAST отдельным workflow: для репозитория, у которого уже есть свой
# ci.yml и его нельзя перезаписывать шаблоном. Триггеры и отмена - канон.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    # СЕКРЕТЫ И SAST на каждом PR и пуше в main. Находка роняет проверку: красный PR
    # не вливается, а причина видна в журнале этого job'а. Журналы публичного
    # репозитория публичны, поэтому gitleaks запускается с --redact и значение
    # найденного ключа в журнал не попадает.
    #
    # Job идёт на облачном раннере всегда: ему нужен docker, а раннер без
    # docker-группы его не даёт. Код PR он не исполняет, только читает.
    #
    # ЛОЖНЫЕ СРАБАТЫВАНИЯ: .gitleaksignore (отпечатки), .semgrepignore (пути) или
    # `nosemgrep` в строке с причиной. В .gitleaksignore попадает только ложное
    # срабатывание. Настоящий секрет сначала ротируют, и только потом его
    # отпечаток можно глушить.
    #
    # Образы закреплены по digest: gitleaks v8.30.1, Semgrep 1.182.0. Dependabot
    # образы из `docker run` не видит, поэтому digest обновляют руками при
    # квартальной проверке.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '-1' }}
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --verbose --log-opts="$LOG_OPTS" /repo
      - name: semgrep
        run: >
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          semgrep scan --config p/default --metrics=off --error --quiet .
