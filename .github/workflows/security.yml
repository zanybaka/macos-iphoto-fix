name: security

# Секреты на каждом PR ПУБЛИЧНОГО репозитория, отдельным workflow: для репозитория,
# у которого уже есть свой ci.yml и его нельзя перезаписывать шаблоном. Отмена - канон.
#
# На PR идёт только gitleaks. Ключ, попавший в коммит публичного репозитория, боты
# находят за минуты, поэтому его ловят до merge. Semgrep ищет ошибки в коде, и о такой
# ошибке посторонний узнаёт не раньше нас: он идёт раз в день по main, в
# security-weekly.yml. Пуш в main здесь не сканируется, потому что тот же код уже
# прошёл скан в PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    # Находка роняет проверку: красный PR не вливается, а причина видна в журнале
    # этого job'а. Журналы публичного репозитория публичны, поэтому gitleaks
    # запускается с --redact и значение найденного ключа в журнал не попадает.
    #
    # ЛОЖНЫЕ СРАБАТЫВАНИЯ: .gitleaksignore (отпечатки). В .gitleaksignore попадает
    # только ложное срабатывание. Настоящий секрет сначала ротируют, и только потом
    # его отпечаток можно глушить.
    #
    # Образ закреплён по digest: gitleaks v8.30.1. Dependabot образы из `docker run`
    # не видит, поэтому digest обновляют руками при квартальной проверке.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '-1' }}
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --verbose --log-opts="$LOG_OPTS" /repo
